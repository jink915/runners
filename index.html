<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>러너스 예배</title>
<meta name="description" content="러너스 주일 예배 사회·대표기도 배정과 사회 원고">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" id="theme-color">
<script>
  /* 저장된 화면 모드를 그리기 전에 적용 (깜빡임 방지). 기본은 밝은 모드 */
  try{ if(localStorage.getItem("runners-theme")==="dark"){ document.documentElement.dataset.theme="dark"; document.querySelector("#theme-color").content="#132B55"; } }catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="러너스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="gate">
<header class="top" id="top">
  <div class="wrap">
    <button class="icon-btn menu-btn" type="button" data-act="menu" aria-label="메뉴 열기" aria-controls="drawer" aria-expanded="false">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
    <a class="brand" href="#portal"><img src="icons/icon-192.png" alt="" width="32" height="32"><span translate="no">러너스</span><span class="dept" id="dept"></span></a>
    <nav class="tabs" id="tabs" aria-label="화면"></nav>
    <button class="icon-btn theme-toggle" type="button" data-act="theme" aria-label="다크 모드로 바꾸기"><span class="swap" aria-hidden="true">
      <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="i moon off" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></button>
    <a class="me" id="me" href="#more" aria-label="내 계정" hidden></a>
  </div>
</header>
<nav class="deskmenu" id="deskmenu" aria-label="부서 메뉴"></nav>
<aside class="quick" id="quick" aria-label="빠른 메뉴"></aside>
<main class="wrap" id="main" tabindex="-1"><div class="splash" role="status"><img class="splash-sheep" src="img/sheep-heart.webp" alt=""><b>러너스</b><span class="dots" aria-label="불러오는 중"><i></i><i></i><i></i></span></div></main>
<div id="drawer-root"></div>
<div id="sheet-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
