<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>러너스 예배</title>
<meta name="description" content="러너스 주일 예배 사회·대표기도 배정과 사회 원고">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#BFE4FB" id="theme-color">
<script>
  /* 저장된 화면 모드를 그리기 전에 적용 (깜빡임 방지). 기본은 밝은 모드 */
  try{ if(localStorage.getItem("runners-theme")==="dark"){ document.documentElement.dataset.theme="dark"; document.querySelector("#theme-color").content="#132B55"; } }catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="러너스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#dash"><img src="icons/icon-192.png" alt="" width="32" height="32"><span translate="no">러너스</span></a>
    <nav class="tabs" id="tabs" aria-label="화면">
      <a href="#dash"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>홈</span></a>
      <a href="#schedule"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect class="fillable" x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>일정</span></a>
      <a href="#people" data-admin hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="9" cy="8" r="3.5"/><path class="fillable" d="M2.5 20c.8-3.6 3.4-5.6 6.5-5.6s5.7 2 6.5 5.6z"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20c-.5-2.5-1.8-4.1-3.6-4.9"/></svg><span>명단</span></a>
      <a href="#script"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M6 3h8.5L19 7.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h5"/></svg><span>원고</span></a>
      <a href="#more"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="12" cy="12" r="8.5"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span>더보기</span></a>
    </nav>
    <button class="icon-btn theme-toggle" type="button" data-act="theme" aria-label="다크 모드로 바꾸기"><span class="swap" aria-hidden="true">
      <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="i moon off" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></button>
    <a class="me" id="me" href="#more" aria-label="내 계정" hidden></a>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<div id="sheet-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
