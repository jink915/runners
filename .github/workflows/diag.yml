name: 임시 점검 (생일 알림)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: 생일 알림 대상·설정 점검 (이름·이메일·토큰은 출력 안 함)
        working-directory: functions
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          node --input-type=module -e '
          import { initializeApp, cert } from "firebase-admin/app";
          import { getFirestore } from "firebase-admin/firestore";
          initializeApp({ credential: cert(JSON.parse(process.env.SA)) });
          const db = getFirestore();
          const kst = new Date(Date.now()+9*3600e3); const today = kst.toISOString().slice(0,10);
          console.log("KST", today, kst.getUTCHours()+"시", "요일", kst.getUTCDay());
          const bds = (await db.collection("birthdays").get()).docs.map(d=>d.data());
          const m = kst.getUTCMonth()+1, dd = kst.getUTCDate();
          console.log("생일 명단", bds.length, "| 오늘 생일", bds.filter(b=>+b.month===m && +b.day===dd).length, "| 월/일 타입 예:", JSON.stringify(bds.slice(0,2).map(b=>({month:b.month, day:b.day, t:typeof b.month}))));
          const members = Object.fromEntries((await db.collection("members").get()).docs.map(d=>[d.id,d.data()]));
          const toks = (await db.collection("pushTokens").get()).docs.map(d=>d.data());
          console.log("알림 기기", toks.length);
          for (const [i,t] of toks.entries()) { const mm = members[t.uid];
            const key = `${today}_bdToday_${t.token.slice(-48).replace(/[^A-Za-z0-9_-]/g,"")}`;
            const sent = (await db.doc(`sentAlerts/${key}`).get()).exists;
            console.log(i+1, JSON.stringify({ member: !!mm, status: mm?.status, owner: !!mm?.owner, role: mm?.role, depts: mm?.depts, view: mm?.view, all: t.prefs?.all, bdToday: t.prefs?.bdToday, bdWeek: t.prefs?.bdWeek, sentToday: sent, updated: t.updatedAt?.toDate?.().toISOString() })); }'
      - name: 오늘 매시 알림 함수 기록 (이름이 든 줄은 제외)
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="remindhourly" AND timestamp>="'"$(date -u -d '-14 hours' +%Y-%m-%dT%H:%M:%SZ)"'"' --project runners-prepare --limit 200 --format='value(timestamp,severity,textPayload)' | grep -vE 'mc=|prayer=' | head -80
          rm -f "$RUNNER_TEMP/sa.json"
