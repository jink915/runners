name: 주일말씀 동기화
on:
  schedule:
    - cron: "30 21 * * *"   # 매일 오전 6시 30분 (한국 시간)
  workflow_dispatch:
    inputs:
      dry:
        description: "미리보기만 (저장하지 않음)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sermons
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 게시판 읽기
        run: node scripts/sermons.mjs
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet -- data/sermons.json; then echo "바뀐 내용 없음"; exit 0; fi
          git config user.name "runners-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermons.json
          git commit -m "주일말씀 자동 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
