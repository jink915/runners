name: 대표기도 알림
on:
  schedule:
    # 한국 시간 오전 6시 ~ 밤 11시, 매시 7분에 실행 → 각자 고른 요일·시각의 알림만 보내요
    - cron: "7 21-23,0-14 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "관리자에게 테스트 알림 보내기"
        type: boolean
        default: true
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
        working-directory: scripts
      - run: node remind.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
