name: 대표기도 알림
on:
  schedule:
    # 알림은 이제 Firebase Cloud Functions가 정각·즉시 보내요. 이건 혹시 놓친 알림을 위한 예비 (6시간마다)
    #  · 이미 보낸 알림은 기록(sentAlerts·notified)이 있어서 두 번 가지 않아요
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "관리자에게 테스트 알림 보내기"
        type: boolean
        default: true
concurrency:
  group: remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: node gh-remind.mjs
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
